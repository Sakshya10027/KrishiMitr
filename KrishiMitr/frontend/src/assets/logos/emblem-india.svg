<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="100%" height="100%">
  <!-- State Emblem of India (Ashoka Lion Capital) -->
  <g fill="#1a1a1a">
    <!-- Center Lion -->
    <path d="M90 20 C90 10, 110 10, 110 20 C114 25, 116 34, 110 40 C108 45, 92 45, 90 40 C84 34, 86 25, 90 20 Z" />
    <path d="M85 35 C75 45, 80 70, 95 75 C97 85, 85 95, 82 105 C78 120, 85 135, 100 135 C115 135, 122 120, 118 105 C115 95, 103 85, 105 75 C120 70, 125 45, 115 35 C110 42, 90 42, 85 35 Z" />
    
    <!-- Left Lion Mane & Profile -->
    <path d="M60 40 C55 35, 45 45, 50 60 C55 75, 70 85, 80 85 C75 75, 70 60, 60 40 Z" />
    <path d="M52 62 C40 70, 42 90, 55 98 C65 105, 75 105, 75 95 C62 90, 58 78, 52 62 Z" />
    <path d="M50 100 C45 110, 55 125, 70 128 C75 128, 78 120, 75 110 C65 112, 55 108, 50 100 Z" />
    
    <!-- Right Lion Mane & Profile -->
    <path d="M140 40 C145 35, 155 45, 150 60 C145 75, 130 85, 120 85 C125 75, 130 60, 140 40 Z" />
    <path d="M148 62 C160 70, 158 90, 145 98 C135 105, 125 105, 125 95 C138 90, 142 78, 148 62 Z" />
    <path d="M150 100 C155 110, 145 125, 130 128 C125 128, 122 120, 125 110 C135 112, 145 108, 150 100 Z" />

    <!-- Lion details & chest -->
    <circle cx="95" cy="32" r="2.5" />
    <circle cx="105" cy="32" r="2.5" />
    <path d="M96 38 L104 38 L100 43 Z" />
    <path d="M90 60 C90 70, 110 70, 110 60 Z" fill="none" stroke="#1a1a1a" stroke-width="2" />
    <path d="M88 85 C88 110, 112 110, 112 85" fill="none" stroke="#1a1a1a" stroke-width="2.5" />

    <!-- Abacus Platform -->
    <rect x="40" y="140" width="120" height="22" rx="3" />
    <!-- Ashoka Chakra on Abacus -->
    <circle cx="100" cy="151" r="9" fill="#ffffff" />
    <circle cx="100" cy="151" r="7.5" fill="none" stroke="#1a1a1a" stroke-width="1.2" />
    <circle cx="100" cy="151" r="1.5" />
    <!-- Spokes -->
    <path d="M100 144 L100 158 M93 151 L107 151 M95 146 L105 156 M95 156 L105 146" stroke="#1a1a1a" stroke-width="0.8" />
    
    <!-- Bull on left, Horse on right -->
    <ellipse cx="62" cy="151" rx="9" ry="5" fill="#ffffff" />
    <circle cx="56" cy="148" r="3" fill="#ffffff" />
    <ellipse cx="138" cy="151" rx="9" ry="5" fill="#ffffff" />
    <circle cx="144" cy="148" r="3" fill="#ffffff" />

    <!-- Inverted Lotus Base -->
    <path d="M50 166 C65 178, 135 178, 150 166 L145 180 C130 190, 70 190, 55 180 Z" />
    <path d="M65 180 C80 188, 120 188, 135 180" fill="none" stroke="#ffffff" stroke-width="2" />

    <!-- Motto Base: Satyameva Jayate (सत्यमेव जयते) in Devanagari -->
    <text x="100" y="210" font-family="'Noto Sans Devanagari', 'Mangal', 'Arial', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">सत्यमेव जयते</text>
  </g>
</svg>
