<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGradField" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81D4FA" />
      <stop offset="40%" stop-color="#E1F5FE" />
      <stop offset="60%" stop-color="#C8E6C9" />
    </linearGradient>
    <linearGradient id="cropGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
  </defs>

  <!-- Sky & horizon -->
  <rect width="600" height="240" fill="url(#skyGradField)" />
  
  <!-- Distant tree line -->
  <path d="M0 80 Q50 65 100 80 T200 75 T300 82 T400 74 T500 78 T600 72 L600 120 L0 120 Z" fill="#33691E" opacity="0.8" />
  
  <!-- Lush Agricultural Crop Rows in Perspective -->
  <path d="M0 100 L600 100 L600 240 L0 240 Z" fill="url(#cropGreen)" />
  
  <!-- Crop ridges and furrows -->
  <g stroke="#43A047" stroke-width="6" opacity="0.6">
    <line x1="300" y1="100" x2="30" y2="240" />
    <line x1="300" y1="100" x2="110" y2="240" />
    <line x1="300" y1="100" x2="200" y2="240" />
    <line x1="300" y1="100" x2="300" y2="240" />
    <line x1="300" y1="100" x2="400" y2="240" />
    <line x1="300" y1="100" x2="490" y2="240" />
    <line x1="300" y1="100" x2="570" y2="240" />
  </g>

  <!-- Foliage texture dots -->
  <g fill="#A5D6A7" opacity="0.5">
    <circle cx="80" cy="180" r="10" />
    <circle cx="160" cy="200" r="14" />
    <circle cx="250" cy="190" r="12" />
    <circle cx="340" cy="210" r="15" />
    <circle cx="430" cy="195" r="11" />
    <circle cx="520" cy="185" r="13" />
  </g>

  <!-- KHET HARA Bold White Typography -->
  <text x="300" y="135" fill="#FFFFFF" font-family="'Inter', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="2" text-anchor="middle" filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.85))">
    KHET HARA
  </text>
</svg>
