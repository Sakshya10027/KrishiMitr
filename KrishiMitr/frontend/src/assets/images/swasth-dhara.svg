<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <radialGradient id="soilGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8D4925" />
      <stop offset="50%" stop-color="#5D2E17" />
      <stop offset="100%" stop-color="#3E1E0E" />
    </radialGradient>
  </defs>
  <!-- Rich Agricultural Soil Texture Background -->
  <rect width="600" height="240" fill="url(#soilGlow)" />
  
  <!-- Soil granules / textures -->
  <g fill="#A0522D" opacity="0.4">
    <circle cx="80" cy="50" r="14" />
    <circle cx="150" cy="80" r="22" />
    <circle cx="220" cy="40" r="18" />
    <circle cx="310" cy="90" r="25" />
    <circle cx="430" cy="60" r="16" />
    <circle cx="510" cy="85" r="28" />
    <circle cx="120" cy="180" r="20" />
    <circle cx="270" cy="160" r="26" />
    <circle cx="390" cy="190" r="18" />
    <circle cx="480" cy="170" r="24" />
  </g>
  <g fill="#2B1408" opacity="0.5">
    <circle cx="100" cy="110" r="10" />
    <circle cx="190" cy="130" r="12" />
    <circle cx="350" cy="140" r="15" />
    <circle cx="460" cy="110" r="11" />
  </g>

  <!-- Small green sprout emerging from the rich soil in center left -->
  <g transform="translate(190, 80) scale(0.7)">
    <path d="M0 40 C-15 25, -20 10, -5 0 C10 10, 5 30, 0 40 Z" fill="#66BB6A" />
    <path d="M0 40 C15 25, 20 10, 5 0 C-10 10, -5 30, 0 40 Z" fill="#81C784" />
    <circle cx="0" cy="40" r="4" fill="#A5D6A7" />
  </g>

  <!-- SWASTH DHARA Bold White Typography -->
  <text x="300" y="135" fill="#FFFFFF" font-family="'Inter', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="2" text-anchor="middle" filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.85))">
    SWASTH DHARA
  </text>
</svg>
