<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logos/shc-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#018840"/>
    <meta name="description" content="Soil Health Card Portal - Government of India, Ministry of Agriculture and Farmers Welfare. Empowering Farmers with Soil Insights for Sustainable Growth." />
    <title>Soil Health Card | Department of Agriculture &amp; Farmers Welfare</title>
  </head>
  <body>
    <!-- Hidden Google Translate Element for automated DOM translation of whole website -->
    <div id="google_translate_element" style="display:none;position:absolute;left:-9999px;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,mr,gu,te,ta,bn,pa,kn,ml,or',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>

    <div id="root" style="width: 100%;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
